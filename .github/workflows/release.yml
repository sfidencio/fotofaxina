name: Instalador Windows

# Publica uma versão nova sozinho:
#   - a cada push na master em que o __version__ de app/__init__.py ainda não tenha Release
#     (para lançar a próxima versão, basta mudar o número e dar push);
#   - ou a cada tag v* (ex.: v1.2.0).
# Também pode ser rodado à mão em Actions → Instalador Windows → Run workflow.
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  versao:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publicar: ${{ steps.v.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('app/__init__.py').read()).group(1))")
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A versão v$v já está publicada; nada a fazer."
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          fi

  # Roda em todo push: traduções completas e garantia de que o HD do usuário nunca é alterado.
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Bibliotecas gráficas para testar a janela (Qt sem tela)
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Conferir traduções
        run: python packaging/check_i18n.py
      - name: Arquivos de origem nunca são alterados, movidos ou apagados
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_origem_intocada.py
      - name: Duplicatas quando a pasta original foi apagada
        run: python tests/test_duplicata_original_apagado.py
      - name: Esquecer registros e caminhos repetidos
        run: python tests/test_esquecer.py
      - name: Fotos parecidas (sequência) não viram duplicata
        run: python tests/test_duplicatas_parecidas.py
      - name: Fotos do mesmo evento vão para o mesmo álbum
        run: python tests/test_evento_continua.py
      - name: Álbuns do Google Fotos (mesmo nome, escolher, criar, juntar, álbum cheio)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_albuns_google.py
      - name: Conferir com o Google Fotos, envio por álbum/pasta, HD sem análise automática
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_conferir_e_envio_parcial.py
      - name: Robustez (rede, HD desplugado, IA depois, login, letra do HD, vídeos…)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_robustez.py

  # Gera a IA leve (CLIP -> ONNX int8). Fica em cache enquanto as frases/script não mudarem.
  modelo:
    needs: versao
    if: needs.versao.outputs.publicar == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: models
          key: modelo-${{ hashFiles('packaging/build_model.py', 'app/ai_prompts.py', 'app/classifier.py', 'packaging/requirements-model.txt') }}
      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.11"
      - name: Gerar modelo
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu || { echo "::error title=modelo::falhou ao instalar o torch"; exit 1; }
          pip install -r packaging/requirements-model.txt || { echo "::error title=modelo::falhou ao instalar requirements-model"; exit 1; }
          python packaging/build_model.py
      - uses: actions/upload-artifact@v4
        with:
          name: modelo
          path: models/
          retention-days: 7

  windows:
    needs: [versao, modelo, testes]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.versao.outputs.version }}
      # opcional: conteúdo do client_secret.json do Google Cloud (Settings > Secrets > Actions).
      # Com ele, o usuário final só clica em "Conectar conta Google".
      GOOGLE_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: modelo
          path: models

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependências (para os testes)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt -c packaging/constraints-windows.txt
          if ($LASTEXITCODE -ne 0) { throw "Falha ao instalar as dependências" }

      - name: Conferir traduções
        run: python packaging/check_i18n.py

      - name: Arquivos de origem nunca são alterados (no Windows)
        run: python tests/test_origem_intocada.py

      - name: Robustez no Windows (inclui o login protegido pela DPAPI)
        run: python tests/test_robustez.py

      - name: Gravar versão no app
        shell: pwsh
        run: |
          (Get-Content app/__init__.py) -replace '__version__ = ".*"', "__version__ = `"$env:VERSION`"" | Set-Content app/__init__.py

      - name: Credencial do Google (se configurada)
        if: env.GOOGLE_CLIENT_SECRET_JSON != ''
        shell: pwsh
        run: Set-Content -Path packaging/client_secret.json -Value $env:GOOGLE_CLIENT_SECRET_JSON -Encoding utf8NoBOM

      # Sem .exe próprio: o pacote leva o Python OFICIAL do python.org (python.exe/pythonw.exe
      # assinados pela Python Software Foundation, confiáveis para os antivírus), o código-fonte e um
      # FotoFaxina.cmd que abre o app.
      - name: Montar o pacote (Python oficial embutido + código)
        shell: pwsh
        run: |
          $pyver = "3.12.10"
          $pkg = "pkg\FotoFaxina"
          New-Item -ItemType Directory -Force $pkg, dist | Out-Null
          Invoke-WebRequest "https://www.python.org/ftp/python/$pyver/python-$pyver-embed-amd64.zip" -OutFile python-embed.zip
          Expand-Archive python-embed.zip "$pkg\python"
          # o Python embutido só enxerga o que está no arquivo ._pth: as bibliotecas e a pasta do app
          $pth = Get-ChildItem "$pkg\python\python*._pth" | Select-Object -First 1
          $stdlib = (Get-ChildItem "$pkg\python\python3*.zip" | Select-Object -First 1).Name
          Set-Content -Path $pth.FullName -Encoding ascii -Value @($stdlib, ".", "Lib\site-packages", "..", "import site")
          # bibliotecas; do Qt, só o essencial (o PySide6 completo tem centenas de MB que o app não usa)
          (Get-Content requirements.txt) -replace '^PySide6\b.*', 'PySide6-Essentials' | Set-Content req-pacote.txt
          python -m pip install --no-compile --target "$pkg\python\Lib\site-packages" -r req-pacote.txt -c packaging/constraints-windows.txt
          if ($LASTEXITCODE -ne 0) { throw "Falha ao instalar as bibliotecas no pacote" }
          # código, ícones e modelo de IA
          Copy-Item main.py, LICENSE, README.md, README.en.md $pkg
          Copy-Item app $pkg -Recurse
          New-Item -ItemType Directory -Force "$pkg\assets" | Out-Null
          Copy-Item assets\icon-256.png, assets\icon.ico, assets\mascote-128.png "$pkg\assets"
          Copy-Item models $pkg -Recurse
          if (Test-Path packaging\client_secret.json) { Copy-Item packaging\client_secret.json $pkg }
          Get-ChildItem $pkg -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          # atalhos
          Set-Content -Encoding ascii "$pkg\FotoFaxina.cmd" -Value @(
            '@echo off',
            'rem Abre o FotoFaxina com o Python que vem nesta pasta (nao precisa instalar nada).',
            'start "" "%~dp0python\pythonw.exe" "%~dp0main.py" %*')
          Set-Content -Encoding ascii "$pkg\FotoFaxina-diagnostico.cmd" -Value @(
            '@echo off',
            'rem Abre o FotoFaxina mostrando as mensagens de erro (use se o FotoFaxina.cmd nao abrir).',
            '"%~dp0python\python.exe" "%~dp0main.py" %*',
            'pause')
          "{0:N0} MB" -f ((Get-ChildItem $pkg -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)

      - name: Testar o pacote (Python embutido, IA e janela)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force teste | Out-Null
          python -c "from PIL import Image, ImageDraw; im=Image.new('RGB',(900,900),'white'); d=ImageDraw.Draw(im); d.rectangle([0,0,900,150],fill='black'); im.save('teste/IMG-20240101-WA0001.jpg'); Image.new('RGB',(1200,800),(30,120,200)).save('teste/IMG-20240102-WA0002.jpg')"
          $env:FOTOFAXINA_DIR = "$pwd\teste-dados"
          $py = "pkg\FotoFaxina\python\python.exe"
          & $py pkg\FotoFaxina\main.py --cli teste *>&1 | Tee-Object -FilePath saida.txt
          if ($LASTEXITCODE -ne 0) { throw "O pacote falhou (código $LASTEXITCODE)" }
          if (-not (Select-String -Path saida.txt -Pattern "IA leve carregada|Lightweight AI loaded" -Quiet)) {
            throw "A IA não carregou no pacote"
          }
          $env:QT_QPA_PLATFORM = "offscreen"
          & $py -c "from PySide6.QtWidgets import QApplication; a=QApplication([]); from app.config import Config; from app.gui.main_window import MainWindow; c=Config.load(); c.welcome_done=True; w=MainWindow(c); print('janela ok')"
          if ($LASTEXITCODE -ne 0) { throw "A janela não abriu com o Python do pacote" }

      - name: Empacotar (zip)
        shell: pwsh
        run: |
          7z a -tzip -mx=7 "dist\FotoFaxina-$env:VERSION-windows.zip" .\pkg\FotoFaxina | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Falha ao gerar o zip" }
          # modelo de IA avulso: o botão "Baixar modelo de IA" do app (quem roda pelo código) usa este arquivo
          Compress-Archive -Path models -DestinationPath "dist\fotofaxina-ia-modelo.zip"
          # somas de verificação: quem baixa pode conferir que o arquivo é o original
          Get-ChildItem dist\FotoFaxina-*-windows.zip, dist\fotofaxina-ia-modelo.zip | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt
          Get-ChildItem dist | Format-Table Name, Length

      - name: Guardar arquivos do build
        uses: actions/upload-artifact@v4
        with:
          name: FotoFaxina-${{ env.VERSION }}
          path: |
            dist/FotoFaxina-*-windows.zip
            dist/fotofaxina-ia-modelo.zip
            dist/SHA256SUMS.txt

      - name: Publicar Release
        if: needs.versao.outputs.publicar == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: FotoFaxina ${{ env.VERSION }}
          make_latest: true
          files: |
            dist/FotoFaxina-*-windows.zip
            dist/fotofaxina-ia-modelo.zip
            dist/SHA256SUMS.txt
          body: |
            ## 🇧🇷 Como usar (sem instalar)
            1. Baixe **FotoFaxina-${{ env.VERSION }}-windows.zip** (abaixo, em Assets).
            2. **Antes de extrair:** clique com o botão direito no zip → **Propriedades** → marque
               **Desbloquear** → OK. (Evita o aviso do Windows em cada arquivo.)
            3. Clique com o botão direito → **Extrair tudo…** e escolha uma pasta, por exemplo `Documentos\FotoFaxina`.
            4. Abra a pasta extraída e dê dois cliques em **FotoFaxina.cmd**. (Se não abrir, use
               **FotoFaxina-diagnostico.cmd**, que mostra a mensagem de erro.)
            5. No FotoFaxina: **Conectar conta Google** → escolha a pasta → **Analisar** → confira → **Enviar**.

            Não precisa instalar Python nem ter senha de administrador: o zip traz o Python oficial do
            python.org (assinado pela Python Software Foundation) e o código-fonte do FotoFaxina — nenhum
            executável próprio, o que evita alarmes falsos de antivírus.
            Para atualizar: extraia a versão nova por cima (ou em outra pasta) — o histórico e o login ficam em
            `C:\Users\<você>\.fotofaxina` e são mantidos.
            Primeira vez configurando o Google? [Passo a passo em português](https://github.com/${{ github.repository }}/blob/master/docs/CONFIGURAR-GOOGLE.md).

            ## 🇺🇸 How to use (no installation)
            1. Download **FotoFaxina-${{ env.VERSION }}-windows.zip** (below, under Assets).
            2. **Before extracting:** right-click the zip → **Properties** → tick **Unblock** → OK.
            3. Right-click → **Extract All…** and pick a folder, e.g. `Documents\FotoFaxina`.
            4. Open the extracted folder and double-click **FotoFaxina.cmd**. (If it doesn't open, use
               **FotoFaxina-diagnostico.cmd**, which shows the error message.)
            5. In FotoFaxina: **Connect Google account** → choose the folder → **Analyze** → review → **Upload**.

            No need to install Python or an administrator password: the zip ships the official Python from
            python.org (signed by the Python Software Foundation) plus FotoFaxina's source code — no custom
            executable, which avoids antivirus false alarms. To update, extract the new
            version over the old one; your history and sign-in live in `C:\Users\<you>\.fotofaxina` and are kept.
            First time setting up Google? [Step-by-step guide](https://github.com/${{ github.repository }}/blob/master/docs/GOOGLE-SETUP.md).

            ---
            🔒 O código é aberto e o pacote é gerado automaticamente pelo GitHub Actions a partir deste
            repositório. Confira a integridade com o `SHA256SUMS.txt`. /
            Open source, built automatically by GitHub Actions from this repository. Verify with `SHA256SUMS.txt`.
