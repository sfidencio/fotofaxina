name: Instalador Windows

# Publica uma versão nova sozinho:
#   - a cada push na master em que o __version__ de app/__init__.py ainda não tenha Release
#     (para lançar a próxima versão, basta mudar o número e dar push);
#   - ou a cada tag v* (ex.: v1.2.0).
# Também pode ser rodado à mão em Actions → Instalador Windows → Run workflow.
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  versao:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publicar: ${{ steps.v.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('app/__init__.py').read()).group(1))")
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A versão v$v já está publicada; nada a fazer."
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          fi

  # Roda em todo push: traduções completas e garantia de que o HD do usuário nunca é alterado.
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Bibliotecas gráficas para testar a janela (Qt sem tela)
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Conferir traduções
        run: python packaging/check_i18n.py
      - name: Arquivos de origem nunca são alterados, movidos ou apagados
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_origem_intocada.py
      - name: Duplicatas quando a pasta original foi apagada
        run: python tests/test_duplicata_original_apagado.py
      - name: Esquecer registros e caminhos repetidos
        run: python tests/test_esquecer.py
      - name: Fotos parecidas (sequência) não viram duplicata
        run: python tests/test_duplicatas_parecidas.py
      - name: Fotos do mesmo evento vão para o mesmo álbum
        run: python tests/test_evento_continua.py
      - name: Robustez (rede, HD desplugado, IA depois, login, letra do HD, vídeos…)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_robustez.py

  # Gera a IA leve (CLIP -> ONNX int8). Fica em cache enquanto as frases/script não mudarem.
  modelo:
    needs: versao
    if: needs.versao.outputs.publicar == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: models
          key: modelo-${{ hashFiles('packaging/build_model.py', 'app/ai_prompts.py', 'app/classifier.py', 'packaging/requirements-model.txt') }}
      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.11"
      - name: Gerar modelo
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu || { echo "::error title=modelo::falhou ao instalar o torch"; exit 1; }
          pip install -r packaging/requirements-model.txt || { echo "::error title=modelo::falhou ao instalar requirements-model"; exit 1; }
          python packaging/build_model.py
      - uses: actions/upload-artifact@v4
        with:
          name: modelo
          path: models/
          retention-days: 7

  windows:
    needs: [versao, modelo, testes]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.versao.outputs.version }}
      # opcional: conteúdo do client_secret.json do Google Cloud (Settings > Secrets > Actions).
      # Com ele, o usuário final só clica em "Conectar conta Google".
      GOOGLE_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: modelo
          path: models

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependências
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel
          # versões fixas (packaging/constraints-windows.txt): o instalador não quebra sozinho
          pip install -r requirements.txt -c packaging/constraints-windows.txt
          if ($LASTEXITCODE -ne 0) { throw "Falha ao instalar as dependências" }
          # PyInstaller com o "bootloader" compilado aqui mesmo: o bootloader padrão é usado por
          # muito malware e por isso é alvo de falsos positivos nos antivírus.
          $env:PYINSTALLER_COMPILE_BOOTLOADER = "1"
          pip install --no-binary pyinstaller pyinstaller -c packaging/constraints-windows.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Não deu para compilar o bootloader; usando o padrão."
            pip install pyinstaller -c packaging/constraints-windows.txt
          }

      - name: Conferir traduções
        run: python packaging/check_i18n.py

      - name: Arquivos de origem nunca são alterados (no Windows)
        run: python tests/test_origem_intocada.py

      - name: Robustez no Windows (inclui o login protegido pela DPAPI)
        run: python tests/test_robustez.py

      - name: Gravar versão no app
        shell: pwsh
        run: |
          (Get-Content app/__init__.py) -replace '__version__ = ".*"', "__version__ = `"$env:VERSION`"" | Set-Content app/__init__.py

      - name: Credencial do Google (se configurada)
        if: env.GOOGLE_CLIENT_SECRET_JSON != ''
        shell: pwsh
        run: Set-Content -Path packaging/client_secret.json -Value $env:GOOGLE_CLIENT_SECRET_JSON -Encoding utf8NoBOM

      - name: Gerar executável (PyInstaller)
        run: pyinstaller packaging/fotofaxina.spec --noconfirm

      - name: Testar executável (análise + IA)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force teste | Out-Null
          python -c "from PIL import Image, ImageDraw; im=Image.new('RGB',(900,900),'white'); d=ImageDraw.Draw(im); d.rectangle([0,0,900,150],fill='black'); im.save('teste/IMG-20240101-WA0001.jpg'); Image.new('RGB',(1200,800),(30,120,200)).save('teste/IMG-20240102-WA0002.jpg')"
          $env:FOTOFAXINA_DIR = "$pwd\teste-dados"
          $p = Start-Process -FilePath dist\FotoFaxina\FotoFaxina.exe -ArgumentList "--cli","teste" -Wait -PassThru
          Get-Content teste-dados\cli.log
          if ($p.ExitCode -ne 0) { throw "O executável falhou (código $($p.ExitCode))" }
          if (-not (Select-String -Path teste-dados\cli.log -Pattern "IA leve carregada|Lightweight AI loaded" -Quiet)) {
            throw "A IA não carregou dentro do executável"
          }

      - name: Gerar instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Falha no Inno Setup" }
          Compress-Archive -Path dist\FotoFaxina -DestinationPath "dist\FotoFaxina-portatil-$env:VERSION.zip"
          # modelo de IA avulso: o botão "Baixar modelo de IA" do app (quem roda pelo código) usa este arquivo
          Compress-Archive -Path models -DestinationPath "dist\fotofaxina-ia-modelo.zip"
          # somas de verificação: quem baixa pode conferir que o arquivo é o original
          Get-ChildItem dist\FotoFaxina-Setup-*.exe, dist\FotoFaxina-portatil-*.zip, dist\fotofaxina-ia-modelo.zip | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Guardar arquivos do build
        uses: actions/upload-artifact@v4
        with:
          name: FotoFaxina-${{ env.VERSION }}
          path: |
            dist/FotoFaxina-Setup-*.exe
            dist/FotoFaxina-portatil-*.zip
            dist/fotofaxina-ia-modelo.zip
            dist/SHA256SUMS.txt

      - name: Publicar Release
        if: needs.versao.outputs.publicar == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: FotoFaxina ${{ env.VERSION }}
          make_latest: true
          files: |
            dist/FotoFaxina-Setup-*.exe
            dist/FotoFaxina-portatil-*.zip
            dist/fotofaxina-ia-modelo.zip
            dist/SHA256SUMS.txt
          body: |
            ## 🇧🇷 Como instalar
            1. Baixe **FotoFaxina-Setup-${{ env.VERSION }}.exe** (abaixo, em Assets).
            2. Abra o arquivo. Se o Windows mostrar "O Windows protegeu o computador", clique em
               **Mais informações → Executar assim mesmo** (o instalador ainda não tem assinatura digital).
            3. Avance até o fim. Não precisa de senha de administrador nem de Python.
            4. No FotoFaxina: **Conectar conta Google** → plugue o HD → confira → **Enviar**.

            Primeira vez configurando o Google? [Passo a passo em português](https://github.com/${{ github.repository }}/blob/master/docs/CONFIGURAR-GOOGLE.md).
            Versão portátil (sem instalar): baixe o `.zip`, extraia e abra `FotoFaxina.exe`.

            ## 🇺🇸 How to install
            1. Download **FotoFaxina-Setup-${{ env.VERSION }}.exe** (below, under Assets).
            2. Open it. If Windows shows "Windows protected your PC", click
               **More info → Run anyway** (the installer is not digitally signed yet).
            3. Click through to the end. No administrator password or Python needed.
            4. In FotoFaxina: **Connect Google account** → plug in the drive → review → **Upload**.

            First time setting up Google? [Step-by-step guide](https://github.com/${{ github.repository }}/blob/master/docs/GOOGLE-SETUP.md).

            ---
            🔒 O código é aberto e o instalador é gerado automaticamente pelo GitHub Actions a partir
            deste repositório. Confira a integridade com o `SHA256SUMS.txt`. /
            Open source, built automatically by GitHub Actions from this repository. Verify with `SHA256SUMS.txt`.
