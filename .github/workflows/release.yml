name: Instalador Windows

# Publica uma versão nova sozinho:
#   - a cada push na master em que o __version__ de app/__init__.py ainda não tenha Release
#     (para lançar a próxima versão, basta mudar o número e dar push);
#   - ou a cada tag v* (ex.: v1.2.0).
# Também pode ser rodado à mão em Actions → Instalador Windows → Run workflow.
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  versao:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publicar: ${{ steps.v.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('app/__init__.py').read()).group(1))")
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A versão v$v já está publicada; nada a fazer."
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: versao
    if: needs.versao.outputs.publicar == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.versao.outputs.version }}
      # opcional: conteúdo do client_secret.json do Google Cloud (Settings > Secrets > Actions).
      # Com ele, o usuário final só clica em "Conectar conta Google".
      GOOGLE_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Gravar versão no app
        shell: pwsh
        run: |
          (Get-Content app/__init__.py) -replace '__version__ = ".*"', "__version__ = `"$env:VERSION`"" | Set-Content app/__init__.py

      - name: Credencial do Google (se configurada)
        if: env.GOOGLE_CLIENT_SECRET_JSON != ''
        shell: pwsh
        run: Set-Content -Path packaging/client_secret.json -Value $env:GOOGLE_CLIENT_SECRET_JSON -Encoding utf8NoBOM

      - name: Gerar executável (PyInstaller)
        run: pyinstaller packaging/fotofaxina.spec --noconfirm

      - name: Testar executável
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force teste | Out-Null
          $env:FOTOFAXINA_DIR = "$pwd\teste-dados"
          $p = Start-Process -FilePath dist\FotoFaxina\FotoFaxina.exe -ArgumentList "--cli","teste" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "O executável falhou (código $($p.ExitCode))" }

      - name: Gerar instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Falha no Inno Setup" }
          Compress-Archive -Path dist\FotoFaxina -DestinationPath "dist\FotoFaxina-portatil-$env:VERSION.zip"

      - name: Guardar arquivos do build
        uses: actions/upload-artifact@v4
        with:
          name: FotoFaxina-${{ env.VERSION }}
          path: |
            dist/FotoFaxina-Setup-*.exe
            dist/FotoFaxina-portatil-*.zip

      - name: Publicar Release
        if: needs.versao.outputs.publicar == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: FotoFaxina ${{ env.VERSION }}
          make_latest: true
          files: |
            dist/FotoFaxina-Setup-*.exe
            dist/FotoFaxina-portatil-*.zip
          body: |
            ## Como instalar
            1. Baixe **FotoFaxina-Setup-${{ env.VERSION }}.exe** (abaixo, em Assets).
            2. Abra o arquivo. Se o Windows mostrar "O Windows protegeu o computador", clique em
               **Mais informações → Executar assim mesmo** (o instalador não é assinado digitalmente).
            3. Avance até o fim. Não precisa de senha de administrador nem de Python.
            4. No FotoFaxina: **Conectar conta Google** → plugue o HD → confira → **Enviar**.

            Primeira vez configurando o Google? Veja o
            [passo a passo em português](https://github.com/${{ github.repository }}/blob/master/docs/CONFIGURAR-GOOGLE.md).

            Versão portátil (sem instalar): baixe o `.zip`, extraia e abra `FotoFaxina.exe`.
